name: Mac build

on:
  workflow_dispatch:
  push:
    branches: [main]

concurrency:
  group: mac-build
  cancel-in-progress: true

jobs:
  mac:
    runs-on: macos-15
    timeout-minutes: 300
    env:
      HISE_SHA: 5d34685fe1a9e75e40dd4171270d764a2fdc0de9
      JUCE_SHA: b19c001a3553478723d8edb8e2fd74fd345c5154
      FAUST_TAG: 2.74.6
      HISE_DIR: ${{ github.workspace }}/HISE
      PROJECT_DIR: ${{ github.workspace }}/project
      LOGS: ${{ github.workspace }}/logs
      OUT: ${{ github.workspace }}/out

    steps:
      - name: Get project
        uses: actions/checkout@v5
        with:
          path: project

      - name: Get HISE
        id: hise_src
        run: |
          mkdir -p "$LOGS" "$OUT"
          sw_vers | tee "$LOGS/machine.txt"
          xcodebuild -version | tee -a "$LOGS/machine.txt"
          git init -q "$HISE_DIR"
          cd "$HISE_DIR"
          git remote add origin https://github.com/christophhart/HISE.git
          git fetch -q --depth 1 origin "$HISE_SHA"
          git checkout -q FETCH_HEAD
          git submodule update --init --depth 1 JUCE
          echo "HISE $(git rev-parse HEAD)" | tee -a "$LOGS/machine.txt"
          echo "JUCE $(git -C JUCE rev-parse HEAD)" | tee -a "$LOGS/machine.txt"
          if [ "$(git -C JUCE rev-parse HEAD)" != "$JUCE_SHA" ]; then echo "::warning title=JUCE::JUCE commit differs from the Windows machine"; fi
          cd tools/SDK && tar -xf sdk.zip
          ls "$HISE_DIR/tools/SDK" | tee -a "$LOGS/machine.txt"
          mkdir -p "$HISE_DIR/faust"
          curl -fsSL -o "$HISE_DIR/faust/export.h" "https://raw.githubusercontent.com/grame-cncm/faust/$FAUST_TAG/architecture/faust/export.h"
          chmod +x "$HISE_DIR/JUCE/Projucer/Projucer.app/Contents/MacOS/Projucer"
          chmod +x "$HISE_DIR/tools/projucer/xcbeautify" || true
          /usr/sbin/softwareupdate --install-rosetta --agree-to-license > /dev/null 2>&1 || true

      - name: Restore HISE build
        id: cache
        uses: actions/cache/restore@v4
        with:
          path: HISE/projects/standalone/Builds/MacOSX/build/CI/HISE.app
          key: hise-app-${{ env.HISE_SHA }}-ci-arm64-macos15-v1

      - name: Build HISE
        id: hise_build
        if: steps.cache.outputs.cache-hit != 'true'
        timeout-minutes: 150
        run: |
          set -o pipefail
          cd "$HISE_DIR"
          "JUCE/Projucer/Projucer.app/Contents/MacOS/Projucer" --resave "projects/standalone/HISE Standalone.jucer" 2>&1 | tee "$LOGS/hise-projucer.log"
          xcodebuild -project "projects/standalone/Builds/MacOSX/HISE Standalone.xcodeproj" \
            -configuration CI -jobs 3 ARCHS=arm64 ONLY_ACTIVE_ARCH=YES \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 \
            | tee "$LOGS/hise-build.log" | "$HISE_DIR/tools/projucer/xcbeautify" --renderer github-actions

      - name: Save HISE build
        if: steps.hise_build.outcome == 'success'
        uses: actions/cache/save@v4
        with:
          path: HISE/projects/standalone/Builds/MacOSX/build/CI/HISE.app
          key: hise-app-${{ env.HISE_SHA }}-ci-arm64-macos15-v1

      - name: Export project
        id: export
        timeout-minutes: 30
        run: |
          set -o pipefail
          HISE_BIN="$HISE_DIR/projects/standalone/Builds/MacOSX/build/CI/HISE.app/Contents/MacOS/HISE"
          cd "$PROJECT_DIR"
          mkdir -p AudioFiles Binaries Images Presets SampleMaps Samples Scripts UserPresets XmlPresetBackups AdditionalSourceCode DspNetworks MidiFiles Expansions
          "$HISE_BIN" set_project_folder -p:"$PROJECT_DIR" 2>&1 | tee "$LOGS/export.log"
          "$HISE_BIN" export_ci "XmlPresetBackups/DuckingSpace.xml" -t:effect -p:VST_AU -a:x64 -nolto -D:HISE_INCLUDE_FAUST=1 2>&1 | tee -a "$LOGS/export.log"
          test -f "$PROJECT_DIR/Binaries/AutogeneratedProject.jucer"

      - name: Build plugin
        id: plugin
        timeout-minutes: 150
        run: |
          set -o pipefail
          cd "$PROJECT_DIR/Binaries"
          "$HISE_DIR/JUCE/Projucer/Projucer.app/Contents/MacOS/Projucer" --resave AutogeneratedProject.jucer 2>&1 | tee "$LOGS/plugin-projucer.log"
          mkdir -p JuceLibraryCode/faust && cp "$HISE_DIR/faust/export.h" JuceLibraryCode/faust/export.h
          ls Builds/MacOSX | tee -a "$LOGS/plugin-projucer.log"
          PROJ=$(ls -d Builds/MacOSX/*.xcodeproj | head -1)
          xcodebuild -project "$PROJ" -configuration Release -jobs 3 \
            ARCHS="arm64 x86_64" ONLY_ACTIVE_ARCH=NO \
            CODE_SIGN_IDENTITY=- DEVELOPMENT_TEAM= 2>&1 \
            | tee "$LOGS/plugin-build.log" | "$HISE_DIR/tools/projucer/xcbeautify" --renderer github-actions
          find Builds/MacOSX/build -maxdepth 2 \( -name "*.vst3" -o -name "*.component" \) -print | tee "$LOGS/products.txt"

      - name: Sign and pack
        id: pack
        if: steps.plugin.outcome == 'success'
        run: |
          shopt -s nullglob
          cd "$PROJECT_DIR/Binaries/Builds/MacOSX/build/Release"
          for p in *.vst3 *.component; do
            codesign --force --deep -s - "$p"
            ditto "$p" "$OUT/$p"
            lipo -info "$p/Contents/MacOS/"* | tee -a "$LOGS/lipo.txt"
          done

      - name: Apple AU check
        id: auval
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        run: |
          PC=$(sed -n 's/.*<PluginCode value="\([^"]*\)".*/\1/p' "$PROJECT_DIR/project_info.xml")
          MC=$(sed -n 's/.*<CompanyCode value="\([^"]*\)".*/\1/p' "$PROJECT_DIR/user_info.xml")
          mkdir -p ~/Library/Audio/Plug-Ins/Components
          cp -R "$OUT"/*.component ~/Library/Audio/Plug-Ins/Components/
          killall -9 AudioComponentRegistrar 2>/dev/null || true
          sleep 3
          auval -a > "$LOGS/auval-list.txt" 2>&1 || true
          echo "aufx $PC $MC" | tee "$LOGS/auval.txt"
          auval -strict -v aufx "$PC" "$MC" 2>&1 | tee -a "$LOGS/auval.txt"

      - name: Plugin load test
        id: pluginval
        if: steps.pack.outcome == 'success'
        continue-on-error: true
        timeout-minutes: 30
        run: |
          curl -fsSL -o pv.zip https://github.com/Tracktion/pluginval/releases/latest/download/pluginval_macOS.zip
          unzip -q pv.zip
          PV=pluginval.app/Contents/MacOS/pluginval
          rc=0
          for p in "$OUT"/*.vst3 ~/Library/Audio/Plug-Ins/Components/DuckingSpace.component; do
            "$PV" --strictness-level 5 --skip-gui-tests --validate-in-process --timeout-ms 600000 --validate "$p" > "$LOGS/pluginval-$(basename "$p").txt" 2>&1 || rc=1
          done
          exit $rc

      - name: Upload plugin
        if: steps.pack.outcome == 'success'
        uses: actions/upload-artifact@v4
        with:
          name: DuckingSpace-mac-test
          path: out
          retention-days: 3

      - name: Report
        if: always()
        run: |
          set +e
          S="$GITHUB_STEP_SUMMARY"
          {
            echo "## Mac build report"
            echo ""
            echo "| step | result |"
            echo "|---|---|"
            echo "| HISE source | ${{ steps.hise_src.outcome }} |"
            echo "| HISE cached | ${{ steps.cache.outputs.cache-hit }} |"
            echo "| HISE build | ${{ steps.hise_build.outcome }} |"
            echo "| export | ${{ steps.export.outcome }} |"
            echo "| plugin build | ${{ steps.plugin.outcome }} |"
            echo "| sign and pack | ${{ steps.pack.outcome }} |"
            echo "| Apple AU check | ${{ steps.auval.outcome }} |"
            echo "| load test | ${{ steps.pluginval.outcome }} |"
            echo ""
            for f in machine.txt products.txt lipo.txt; do
              [ -f "$LOGS/$f" ] && { echo "### $f"; echo '```'; cat "$LOGS/$f"; echo '```'; }
            done
            for f in hise-build.log plugin-build.log; do
              if [ -f "$LOGS/$f" ]; then
                n=$(grep -cE "error:|fatal error|Undefined symbols|ld: " "$LOGS/$f" || true)
                echo "### $f: $n error lines"
                if [ "$n" != "0" ]; then echo '```'; grep -E -B2 -A3 "error:|fatal error|Undefined symbols|ld: " "$LOGS/$f" | head -120; echo '```'; fi
                echo "#### last lines"; echo '```'; tail -25 "$LOGS/$f"; echo '```'
              fi
            done
            for f in export.log hise-projucer.log plugin-projucer.log auval.txt; do
              [ -f "$LOGS/$f" ] && { echo "### $f"; echo '```'; tail -60 "$LOGS/$f"; echo '```'; }
            done
            for f in "$LOGS"/pluginval-*.txt; do
              [ -f "$f" ] && { echo "### $(basename "$f")"; echo '```'; grep -E "SUCCESS|FAILED|!!!|Starting test|ERROR" "$f" | head -60; tail -15 "$f"; echo '```'; }
            done
          } >> "$S"
          grep -hE "EXPORT ERROR|Error|error" "$LOGS/export.log" 2>/dev/null | head -8 | while read -r l; do echo "::error title=export::$l"; done
          grep -hE "error:" "$LOGS/plugin-build.log" 2>/dev/null | head -8 | while read -r l; do echo "::error title=plugin::$l"; done
          true

      - name: Upload logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: logs
          path: logs
          retention-days: 3
